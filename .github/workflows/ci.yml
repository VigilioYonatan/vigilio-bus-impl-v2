name: bus-impl-v2-ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  merge_group:
    types: [checks_requested]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  packages: read
  attestations: write # delegated: artifact attestation in shared workflow
  id-token: write     # delegated: OIDC token for attestation and AWS in shared workflow
  security-events: write
  pull-requests: read

jobs:
  application:
    uses: VigilioYonatan/vigilio-platform-actions/.github/workflows/shared-backend-node-nest-ci.yml@f6cca7c221ec322ebdabd67f6be1ab2057953ae3 # v1
    with:
      has-cdk: false
      has-openapi: true
      has-postgres: true
      run-aws-integration: true
      run-bdd: true
      run-e2e: true
      run-security-deep: true
      e2e-script: ${{ github.event_name == 'pull_request' && 'test:e2e:critical' || 'test:e2e' }}
      attest-artifact: ${{ github.event_name == 'push' }}
      gitops-bot-actor: ${{ vars.GITOPS_BOT_ACTOR || 'github-actions[bot]' }}
    secrets: inherit

