name: bus-impl-v2-ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  merge_group:
    types: [checks_requested]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  application:
    uses: VigilioYonatan/vigilio-platform-actions/.github/workflows/shared-backend-node-nest-ci.yml@10bcb4e5b6a24f060064f2eb3bd341cab14fa36a # v1
    with:
      has-cdk: false
      has-openapi: true
      has-postgres: true
      run-aws-integration: true
      run-bdd: true
      run-e2e: true
      run-security-deep: true
      e2e-script: test:e2e
      attest-artifact: true
      gitops-bot-actor: github-actions[bot]
    secrets: inherit

