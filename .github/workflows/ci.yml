name: bus-impl-v2-ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    # Skip expensive CI on pushes that only update GitOps manifests or docs.
    # Those changes come from GitOps promotion PRs and don't need a full test run.
    paths-ignore:
      - 'deploy/gitops/**'
      - '**.md'
      - 'docs/**'
  merge_group:
    types: [checks_requested]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  packages: read
  attestations: write # delegated: artifact attestation in shared workflow
  id-token: write     # delegated: OIDC token for attestation and AWS in shared workflow
  security-events: write
  pull-requests: read

jobs:
  application:
    uses: VigilioYonatan/vigilio-platform-actions/.github/workflows/shared-backend-node-nest-ci.yml@275acf334a37e5a93facd580bc80e162c817a343 # v1
    with:
      has-cdk: false
      has-openapi: true
      has-postgres: true
      run-aws-integration: true
      run-bdd: true
      run-e2e: true
      run-browser-e2e: false  # API backend service: no browser .browser.spec.ts files
      run-security-deep: true
      e2e-script: ${{ github.event_name == 'pull_request' && 'test:e2e:critical' || 'test:e2e' }}
      attest-artifact: ${{ github.event_name == 'push' }}
      gitops-bot-actor: ${{ vars.GITOPS_BOT_ACTOR || 'github-actions[bot]' }}
    secrets: inherit
