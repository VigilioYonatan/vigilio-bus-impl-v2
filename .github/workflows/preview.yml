name: bus-impl-v2-container-preview

# Helm and GitOps are validated in vigilio-deploy. This workflow verifies that
# an application pull request still produces a runnable, non-published OCI image.
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'drizzle/**'
      - 'packages/**'
      - 'Dockerfile'
      - '.dockerignore'
      - '.npmrc'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig*.json'
      - '.github/workflows/preview.yml'

concurrency:
  group: bus-impl-v2-preview-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  container-preview:
    name: Build OCI preview without publishing
    uses: VigilioYonatan/vigilio-platform-actions/.github/workflows/shared-container-build-push.yml@2c9e23379ddcb1d7a1bf43edfa699a78a9ee5dc0 # v1
    with:
      dockerfile: Dockerfile
      image-repository: local/bus-impl-v2
      platforms: linux/amd64
      push: false
    secrets:
      GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_PACKAGES_TOKEN }}
