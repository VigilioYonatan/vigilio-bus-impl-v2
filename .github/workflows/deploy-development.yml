name: bus-impl-v2-deploy-development

on:
  # Development deploys are always manual — no auto-trigger on push.
  # Use this to validate a specific commit before staging CI runs.
  workflow_dispatch:
    inputs:
      deploy-mode:
        description: 'apply = full deploy; plan = build + scan only (dry run)'
        required: false
        default: apply
        type: choice
        options: [apply, plan]

concurrency:
  group: bus-impl-v2-deploy-development
  cancel-in-progress: false

permissions:
  contents: read
  packages: read
  id-token: write      # delegated: OIDC for ECR auth and Cosign in shared-container-build-push
  security-events: write  # delegated: Trivy container SARIF upload in shared-container-build-push

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # Job 1: Build multi-arch OCI image, scan with Trivy, push to dev ECR,
  #         sign with Cosign (GitHub OIDC keyless). BuildKit generates SBOM
  #         and SLSA provenance attestations (sbom: true, provenance: mode=max).
  # ─────────────────────────────────────────────────────────────────────────
  container-build:
    name: Build, scan & push container (dev)
    uses: VigilioYonatan/vigilio-platform-actions/.github/workflows/shared-container-build-push.yml@123aff150c7631f3fe054276343d03bbd6bd9eb0 # v1
    with:
      dockerfile: Dockerfile
      image-repository: ${{ vars.ECR_REPOSITORY_DEVELOPMENT }}
      aws-region: ${{ vars.AWS_REGION }}
      push: ${{ inputs.deploy-mode == 'apply' }}
      platforms: ${{ inputs.deploy-mode == 'apply' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
    secrets:
      AWS_ROLE_ARN: ${{ secrets.AWS_BUILD_ROLE_ARN }}
      GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_PACKAGES_TOKEN }}

  # ─────────────────────────────────────────────────────────────────────────
  # Job 2: Update gitops/…/development/values.yaml with the new
  #         immutable image digest and open a GitOps promotion PR.
  # ─────────────────────────────────────────────────────────────────────────
  promote:
    name: GitOps promote → development
    needs: [container-build]
    if: inputs.deploy-mode == 'apply'
    uses: VigilioYonatan/vigilio-platform-actions/.github/workflows/shared-gitops-promote.yml@123aff150c7631f3fe054276343d03bbd6bd9eb0 # v1
    with:
      stage: development
      image-digest: ${{ needs.container-build.outputs.image-digest }}
      gitops-repository: ${{ vars.GITOPS_REPOSITORY }}
      values-file: gitops/apps/bus-impl-v2/development/values.yaml
      gitops-app-client-id: ${{ vars.GITOPS_APP_CLIENT_ID }}
    secrets:
      GITOPS_APP_PRIVATE_KEY: ${{ secrets.GITOPS_APP_PRIVATE_KEY }}

  # ─────────────────────────────────────────────────────────────────────────
  # Job 3: Enable auto-merge on the promotion PR and run smoke tests after
  #         ArgoCD syncs the development cluster.
  # ─────────────────────────────────────────────────────────────────────────
  enable-automerge:
    name: Enable auto-merge on promotion PR
    needs: [container-build, promote]
    if: inputs.deploy-mode == 'apply'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Resolve GitOps repository scope
        id: target
        shell: bash
        env:
          GITOPS_REPO: ${{ vars.GITOPS_REPOSITORY }}
        run: |
          set -euo pipefail
          [[ "${GITOPS_REPO}" =~ ^([A-Za-z0-9][A-Za-z0-9_.-]*)/([A-Za-z0-9][A-Za-z0-9_.-]*)$ ]]
          echo "owner=${BASH_REMATCH[1]}" >> "${GITHUB_OUTPUT}"
          echo "repository=${BASH_REMATCH[2]}" >> "${GITHUB_OUTPUT}"
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        id: app-token
        with:
          client-id: ${{ vars.GITOPS_APP_CLIENT_ID }}
          private-key: ${{ secrets.GITOPS_APP_PRIVATE_KEY }}
          owner: ${{ steps.target.outputs.owner }}
          repositories: ${{ steps.target.outputs.repository }}
          permission-pull-requests: write
          permission-contents: write

      - name: Enable auto-merge on GitOps promotion PR
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          IMAGE_DIGEST: ${{ needs.container-build.outputs.image-digest }}
          GITOPS_REPO: ${{ vars.GITOPS_REPOSITORY }}
        run: |
          set -euo pipefail
          short_digest="${IMAGE_DIGEST#sha256:}"
          branch="gitops/promote-development-${short_digest:0:12}"

          pr_url="$(gh pr list \
            --repo "${GITOPS_REPO}" \
            --head "${branch}" \
            --state open \
            --json url \
            --jq '.[0].url // empty')"

          if [[ -n "${pr_url}" ]]; then
            gh pr merge --auto --squash --delete-branch "${pr_url}"
            echo "Auto-merge enabled on promotion PR: ${pr_url}"
          else
            echo "Promotion PR not found or already merged."
          fi

  smoke:
    name: Smoke tests (development)
    needs: [enable-automerge]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: development
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - uses: VigilioYonatan/vigilio-platform-actions/actions/setup-node-pnpm@123aff150c7631f3fe054276343d03bbd6bd9eb0 # v1
        with:
          github-packages-token: ${{ secrets.GITHUB_PACKAGES_TOKEN || github.token }}
          cache-dependency-path: pnpm-lock.yaml

      - name: Wait for ArgoCD sync + run smoke tests with retry
        shell: bash
        env:
          APP_BASE_URL: ${{ vars.APP_BASE_URL }}
          API_BASE_URL: ${{ vars.APP_BASE_URL }}
        run: |
          set -euo pipefail
          test -n "${APP_BASE_URL}" || {
            echo "::error::APP_BASE_URL is required for development smoke validation"
            exit 1
          }
          echo "Target: ${APP_BASE_URL}"
          for attempt in $(seq 1 20); do
            echo "── Smoke attempt ${attempt}/20 ──"
            if pnpm smoke:endpoints; then
              echo "✓ Smoke passed on attempt ${attempt}"
              exit 0
            fi
            echo "✗ Attempt ${attempt} failed. Waiting 30s..."
            sleep 30
          done
          echo "::error::Smoke tests failed after 20 attempts (10 minutes)"
          exit 1
