name: bus-impl-governance-audit

on:
  workflow_dispatch:
  schedule:
    - cron: '40 11 * * 1'

permissions:
  contents: read
  packages: read

env:
  NODE_VERSION: '24.16.0'
  PNPM_VERSION: '11.7.0'

jobs:
  audit:
    name: Audit GitHub governance drift
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: VigilioYonatan/vigilio-platform-actions/actions/configure-github-packages@87fe5c0890d6a1b639ce00431bf10d92453fdda2 # v1
        with:
          token: ${{ secrets.GITHUB_PACKAGES_TOKEN || github.token }}
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Audit repository settings
        run: pnpm devsecops:governance-audit -- --report-only
        env:
          GOVERNANCE_AUDIT_TOKEN: ${{ secrets.GOVERNANCE_AUDIT_TOKEN || github.token }}
      - name: Enforce governance policy
        if: vars.GOVERNANCE_DRIFT_ENFORCE == 'true'
        run: |
          node -e "const report=require('./reports/github-governance-drift.json'); if(report.status!=='compliant') process.exit(1)"
      - name: Upload governance report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bus-impl-governance-drift-${{ github.run_id }}
          if-no-files-found: error
          path: |
            reports/github-governance-drift.json
            reports/github-governance-drift.md
          retention-days: 365
