name: bus-impl-governance-audit

on:
  workflow_dispatch:
  schedule:
    - cron: '40 11 * * 1'

permissions:
  contents: read
  packages: read

env:
  NODE_VERSION: '24.16.0'
  PNPM_VERSION: '11.7.0'

jobs:
  audit:
    name: Audit GitHub governance drift
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: VigilioYonatan/vigilio-platform-actions/actions/configure-github-packages@af9421ced67d9dcdcfb8f4968f51ad12e47d12f1 # v1
        with:
          token: ${{ secrets.GITHUB_PACKAGES_TOKEN || github.token }}
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Audit repository settings
        run: pnpm devsecops:governance-audit -- --report-only
        env:
          GOVERNANCE_AUDIT_TOKEN: ${{ secrets.GOVERNANCE_AUDIT_TOKEN || github.token }}
      - name: Enforce governance policy
        if: vars.GOVERNANCE_DRIFT_ENFORCE == 'true'
        run: |
          node -e "const report=require('./reports/github-governance-drift.json'); if(report.status!=='compliant') process.exit(1)"
      - name: Upload governance report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bus-impl-governance-drift-${{ github.run_id }}
          if-no-files-found: error
          path: |
            reports/github-governance-drift.json
            reports/github-governance-drift.md
          retention-days: 365
