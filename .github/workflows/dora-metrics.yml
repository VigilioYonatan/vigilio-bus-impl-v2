name: bus-impl-dora-metrics

on:
  workflow_dispatch:
    inputs:
      window_days:
        description: Measurement window
        required: true
        default: '30'
        type: choice
        options: ['7', '30', '90']
  schedule:
    - cron: '25 11 * * 1'

permissions:
  contents: read
  deployments: read
  packages: read

env:
  NODE_VERSION: '24.16.0'
  PNPM_VERSION: '11.7.0'

jobs:
  collect:
    name: Collect DORA metrics
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: VigilioYonatan/vigilio-platform-actions/actions/configure-github-packages@87fe5c0890d6a1b639ce00431bf10d92453fdda2 # v1
        with:
          token: ${{ secrets.GITHUB_PACKAGES_TOKEN || github.token }}
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Collect production deployment metrics
        run: pnpm devsecops:dora -- --window-days "${DORA_WINDOW_DAYS}"
        env:
          DORA_WINDOW_DAYS: ${{ inputs.window_days || '30' }}
          GITHUB_TOKEN: ${{ github.token }}
      - name: Upload DORA report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bus-impl-dora-${{ github.run_id }}
          if-no-files-found: error
          path: |
            reports/dora-metrics.json
            reports/dora-metrics.md
          retention-days: 365
