packages:
  - .
  - packages/*

injectWorkspacePackages: true
dedupeInjectedDeps: true

forceLegacyDeploy: true

overrides:
  multer: '>=2.2.0'
  js-yaml: '>=4.3.0'
  fast-uri: '>=3.1.4'
  find-my-way: '>=9.6.1'
  'body-parser@>=2.0.0 <2.3.0': '>=2.3.0'
  esbuild: 0.28.1

nodeVersion: 24.16.0
engineStrict: true
preferFrozenLockfile: true
verifyStoreIntegrity: true
strictStorePkgContentCheck: true
verifyDepsBeforeRun: error
strictDepBuilds: true
dangerouslyAllowAllBuilds: false
blockExoticSubdeps: true
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - '@vigilioyonatan/*'
  - '@vigilio-services/*'
  - '@aws-sdk/client-bedrock-runtime@3.1106.0'
  - '@aws-sdk/client-sqs@3.1106.0'
  - '@aws-sdk/s3-request-presigner@3.1106.0'
  - '@aws-sdk/token-providers@3.1106.0'
  - '@types/pg@8.21.0'
  - fastify@5.11.3
trustPolicy: no-downgrade
trustLockfile: false
onlyBuiltDependencies:
  - '@nestjs/core'
  - esbuild
ignoredBuiltDependencies:
  - '@scarf/scarf'
  - core-js
allowBuilds:
  '@nestjs/core': true
  esbuild: true
  '@scarf/scarf': false
  core-js: false
